
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b1020">
    <title>ZANY PAY</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            color-scheme: dark;
            --bg: #0b1020;
            --panel: #151d30;
            --border: #293550;
            --text: #f5f7ff;
            --muted: #9ca8c0;
            --accent: #7868ff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, Arial, sans-serif;
        }

        button, input { font: inherit; }
        button { cursor: pointer; }

        .app {
            width: 100%;
            max-width: 600px;
            min-height: 100vh;
            margin: auto;
            padding: 16px 16px 110px;
        }

        .bottom-nav {
            position: fixed;
            z-index: 9999;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-around;
            padding: 10px 6px calc(10px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--border);
            background: #101729;
        }

        .nav-btn {
            flex: 1;
            padding: 8px 2px;
            border: 0;
            border-radius: 12px;
            background: transparent;
            color: var(--muted);
            font-size: 12px;
        }

        .nav-btn.active {
            color: white;
            background: #252347;
        }

        .nav-icon {
            display: block;
            margin-bottom: 4px;
            font-size: 20px;
        }

        .card {
            margin: 12px 0;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--panel);
        }

        .btn {
            padding: 12px 16px;
            border: 0;
            border-radius: 12px;
            background: var(--accent);
            color: white;
            font-weight: 700;
        }

        .input {
            width: 100%;
            margin: 8px 0;
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #0b1020;
            color: white;
        }

        img { max-width: 100%; }
    </style>
</head>

<body>
    <main class="app">
        <div class="card">Загрузка ZANY PAY...</div>
    </main>
<div id="appError" style="display:none;margin:16px;padding:12px;background:#451f2a;color:#fff;border-radius:12px;overflow-wrap:anywhere"></div>
    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="homePage()">
            <span class="nav-icon">⌂</span>Главная
        </button>
        <button class="nav-btn" onclick="shopPage()">
            <span class="nav-icon">🎮</span>Магазин
        </button>
        <button class="nav-btn" onclick="historyPage()">
            <span class="nav-icon">🧾</span>История
        </button>
        <button class="nav-btn" onclick="profilePage()">
            <span class="nav-icon">👤</span>Профиль
        </button>
    </nav>

<script>
window.addEventListener("error", function (event) {
    const errorBox = document.getElementById("appError");
    if (errorBox) {
        errorBox.style.display = "block";
        errorBox.textContent = "Ошибка JavaScript: " + event.message;
    }
});
</script>
<script src="./app.js"></script>
</body>
</html>
